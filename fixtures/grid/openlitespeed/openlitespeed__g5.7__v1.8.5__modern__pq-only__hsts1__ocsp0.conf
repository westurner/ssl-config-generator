# generated 1970-01-01, Mozilla Guideline v5.7, OpenLiteSpeed 1.8.5, OpenSSL 3.6.1, modern config, PQ: only, HSTS
# https://ssl-config.mozilla.org/#server=openlitespeed&version=1.8.5&config=modern&openssl=3.6.1&guideline=5.7&hsts=true&ocsp=false&pq=only

listener https {
  address                 *:443
  secure                  1
  keyFile                 /path/to/private_key
  certFile                /path/to/signed_cert_followed_by_intermediates
  sslProtocol             16
}

context / {
  location                $DOC_ROOT/
  allowBrowse             1
  extraHeaders            Header Set Strict-Transport-Security: max-age=63072000; includeSubDomains
}
