# generated 1970-01-01, Mozilla Guideline v6.0, OpenLiteSpeed 1.8.5, OpenSSL 3.6.1, intermediate config, PQ: hybrid, HSTS, OCSP
# https://ssl-config.mozilla.org/#server=openlitespeed&version=1.8.5&config=intermediate&openssl=3.6.1&guideline=6.0&hsts=true&ocsp=true&pq=hybrid

listener https {
  address                 *:443
  secure                  1
  keyFile                 /path/to/private_key
  certFile                /path/to/signed_cert_followed_by_intermediates
  ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
  enableStapling          1
  sslProtocol             24
}

context / {
  location                $DOC_ROOT/
  allowBrowse             1
  extraHeaders            Header Set Strict-Transport-Security: max-age=63072000; includeSubDomains
}
