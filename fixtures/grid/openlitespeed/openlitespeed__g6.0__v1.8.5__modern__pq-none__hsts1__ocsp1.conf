# generated 1970-01-01, TLSRef Guideline v6.0, OpenLiteSpeed 1.8.5, OpenSSL 4.0.0, modern config, PQ: none, HSTS, OCSP
# https://ssl-config.mozilla.org/#server=openlitespeed&version=1.8.5&config=modern&openssl=4.0.0&guideline=6.0&hsts=true&ocsp=true&pq=none

listener https {
  address                 *:443
  secure                  1
  keyFile                 /path/to/private_key
  certFile                /path/to/signed_cert_followed_by_intermediates
  enableStapling          1
  sslProtocol             16
}

context / {
  location                $DOC_ROOT/
  allowBrowse             1
  extraHeaders            Header Set Strict-Transport-Security: max-age=63072000; includeSubDomains
}
