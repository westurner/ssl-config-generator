# generated 1970-01-01, Mozilla Guideline v6.0, nginx 1.27.3, OpenSSL 3.6.1, modern config, PQ: hybrid
# https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=modern&openssl=3.6.1&guideline=6.0&hsts=false&ocsp=false&pq=hybrid

http {

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        ssl_certificate /path/to/signed_cert_plus_intermediates;
        ssl_certificate_key /path/to/private_key;
    }

    # modern configuration
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;

    # uncomment to enable if ssl_protocols includes TLSv1.2 or earlier;
    # see also ssl_session_ticket_key alternative to stateful session cache
    #ssl_session_timeout 1d;
    #ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
}
