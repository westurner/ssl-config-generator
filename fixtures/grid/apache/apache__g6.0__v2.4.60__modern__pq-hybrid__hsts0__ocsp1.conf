# generated 1970-01-01, Mozilla Guideline v6.0, Apache 2.4.60, OpenSSL 3.6.1, modern config, PQ: hybrid, OCSP
# https://ssl-config.mozilla.org/#server=apache&version=2.4.60&config=modern&openssl=3.6.1&ocsp&guideline=6.0

# this configuration requires mod_ssl and mod_socache_shmcb
<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile      /path/to/signed_cert_and_intermediate_certs
    SSLCertificateKeyFile   /path/to/private_key

    # enable HTTP/2, if available
    Protocols h2 http/1.1
</VirtualHost>

# modern configuration
SSLProtocol             -all +TLSv1.3
SSLOpenSSLConfCmd       Curves X25519MLKEM768:X25519:prime256v1:secp384r1
SSLCipherSuite          TLSv1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
SSLHonorCipherOrder     off
SSLSessionTickets       off

SSLUseStapling On
SSLStaplingCache "shmcb:logs/ssl_stapling(32768)"
