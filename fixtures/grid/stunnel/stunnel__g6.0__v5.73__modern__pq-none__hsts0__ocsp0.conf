; generated 1970-01-01, Mozilla Guideline v6.0, stunnel 5.73, OpenSSL 3.6.1, modern config, PQ: none
; https://ssl-config.mozilla.org/#server=stunnel&version=5.73&config=modern&openssl=3.6.1&guideline=6.0&pq=none

sslVersionMin = TLSv1.3
ciphersuites = TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
curves = X25519:prime256v1:secp384r1

; Example using client mode to proxy IMAP server
[imap-proxy-server]
client = yes
accept = 127.0.0.1:143
connect = imap.example.com:993
CApath = /etc/ssl/certs
checkHost = imap.example.com
verifyChain = yes

; Example serving HTTPS for HTTP service
[https-server]
accept  = 443
connect = 80
CAfile = /path/to/ca-cert
cert = /path/to/cert
key = /path/to/private_key
