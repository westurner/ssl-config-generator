; generated 1970-01-01, TLSRef Guideline v5.7, stunnel 5.73, OpenSSL 4.0.0, old config, PQ: hybrid
; https://ssl-config.mozilla.org/#server=stunnel&version=5.73&config=old&openssl=4.0.0&guideline=5.7&hsts=false&ocsp=false&pq=hybrid

sslVersionMin = TLSv1
curves = X25519:prime256v1:secp384r1
ciphers = @SECLEVEL=0:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA

; Example using client mode to proxy IMAP server
[imap-proxy-server]
client = yes
accept = 127.0.0.1:143
connect = imap.example.com:993
CApath = /etc/ssl/certs
checkHost = imap.example.com
verifyChain = yes

; Example serving HTTPS for HTTP service
[https-server]
accept  = 443
connect = 80
CAfile = /path/to/ca-cert
cert = /path/to/cert
key = /path/to/private_key
