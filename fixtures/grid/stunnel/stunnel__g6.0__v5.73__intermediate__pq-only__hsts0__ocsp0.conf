; generated 1970-01-01, TLSRef Guideline v6.0, stunnel 5.73, OpenSSL 4.0.0, intermediate config, PQ: only
; https://ssl-config.mozilla.org/#server=stunnel&version=5.73&config=intermediate&openssl=4.0.0&guideline=6.0&hsts=false&ocsp=false&pq=only

sslVersionMin = TLSv1.3
ciphersuites = TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
curves = X25519MLKEM768
ciphers = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

; Example using client mode to proxy IMAP server
[imap-proxy-server]
client = yes
accept = 127.0.0.1:143
connect = imap.example.com:993
CApath = /etc/ssl/certs
checkHost = imap.example.com
verifyChain = yes

; Example serving HTTPS for HTTP service
[https-server]
accept  = 443
connect = 80
CAfile = /path/to/ca-cert
cert = /path/to/cert
key = /path/to/private_key
