# The following example shows Squid configured as a cache proxy with SSL bump enabled

http_port 3128 ssl-bump \
  tls-cert=/path/to/ca_signing_cert \
  tls-key=/path/to/ca_signing_private_key \
  options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1,NO_TICKET \
  cipher=ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/cache/squid/ssl_db -M 4MB
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all


# The following example shows Squid configured as a reverse Proxy / Accelerator

https_port 443 accel defaultsite=example.net \
  tls-cert=/path/to/signed_cert_plus_intermediates \
  tls-key=/path/to/private_key \
  options=NO_SSLv3,NO_TLSv1,NO_TLSv1_1,NO_TICKET \
  cipher=ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
