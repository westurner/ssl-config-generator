# generated 1970-01-01, TLSRef Guideline v6.0, HAProxy 3.0, OpenSSL 4.0.0, intermediate config, PQ: only, HSTS, OCSP
# https://ssl-config.mozilla.org/#server=haproxy&version=3.0&config=intermediate&openssl=4.0.0&guideline=6.0&hsts=true&ocsp=true&pq=only
global
    # intermediate configuration
    ssl-default-bind-curves X25519MLKEM768
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers ssl-min-ver TLSv1.3 no-tls-tickets

    ssl-default-server-curves X25519MLKEM768
    ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.3 no-tls-tickets

frontend ft_test
    mode    http
    bind    :443 ssl crt /path/to/<cert+privkey+intermediate> alpn h2,http/1.1
    bind    :80

    # OCSP stapling: place a DER-encoded OCSP response next to the
    # certificate as <crt>.ocsp; HAProxy 3.0 loads it at startup.
    #   openssl ocsp -no_nonce -respout /path/to/<cert>.ocsp \
    #     -issuer /path/to/intermediate.pem \
    #     -cert   /path/to/<cert+privkey+intermediate> \
    #     -url    "$(openssl x509 -in /path/to/<cert+privkey+intermediate> -noout -ocsp_uri)"
    # HAProxy 2.8+ can auto-refresh stapled responses in-process:
    #   tune.ssl.ocsp-update.mode on   # add to the global section above
    redirect scheme https code 308 if !{ ssl_fc }

    # HSTS (63072000 seconds)
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
