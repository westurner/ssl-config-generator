# generated 1970-01-01, Mozilla Guideline v6.0, lighttpd 1.4.82, OpenSSL 3.6.1, modern config, PQ: none, HSTS
# https://ssl-config.mozilla.org/#server=lighttpd&version=1.4.82&config=modern&openssl=3.6.1&hsts&guideline=6.0&pq=none
#server.port = 80
$SERVER["socket"] == "[::]:80" { }

# select one TLS module: "mod_openssl" "mod_mbedtls" "mod_gnutls" "mod_wolfssl" "mod_nss"
server.modules += ("mod_openssl")

# lighttpd 1.4.56 and later will inherit ssl.* from the global scope if
# $SERVER["socket"] contains ssl.engine = "enable" and no other ssl.* options
# (to avoid having to repeat ssl.* directives in both ":443" and "[::]:443")
$SERVER["socket"] ==     ":443" { ssl.engine = "enable" }
$SERVER["socket"] == "[::]:443" { ssl.engine = "enable" }
ssl.privkey = "/path/to/private_key"
ssl.pemfile = "/path/to/signed_cert_followed_by_intermediates"
#ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1.3")  # lighttpd 1.4.82 TLS default
#ssl.openssl.ssl-conf-cmd += ("Curves" => "X25519:prime256v1:secp384r1")  # lighttpd 1.4.82 TLS default appends X448

server.modules += ("mod_redirect")
server.modules += ("mod_setenv")
$HTTP["scheme"] == "https" {
    # HTTP Strict Transport Security (63072000 seconds)
    setenv.add-response-header = (
      "Strict-Transport-Security" => "max-age=63072000; includeSubDomains"
    )
}
else $HTTP["scheme"] == "http" {
    url.redirect = ("" => "https://${url.authority}${url.path}${qsa}")
}
