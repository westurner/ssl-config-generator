# generated 1970-01-01, Mozilla Guideline v5.7, lighttpd 1.4.82, OpenSSL 3.6.1, old config, PQ: hybrid
# https://ssl-config.mozilla.org/#server=lighttpd&version=1.4.82&config=old&openssl=3.6.1&guideline=5.7&hsts=false&ocsp=false&pq=hybrid
#server.port = 80
$SERVER["socket"] == "[::]:80" { }

# select one TLS module: "mod_openssl" "mod_mbedtls" "mod_gnutls" "mod_wolfssl" "mod_nss"
server.modules += ("mod_openssl")

# lighttpd 1.4.56 and later will inherit ssl.* from the global scope if
# $SERVER["socket"] contains ssl.engine = "enable" and no other ssl.* options
# (to avoid having to repeat ssl.* directives in both ":443" and "[::]:443")
$SERVER["socket"] ==     ":443" { ssl.engine = "enable" }
$SERVER["socket"] == "[::]:443" { ssl.engine = "enable" }
ssl.privkey = "/path/to/private_key"
ssl.pemfile = "/path/to/signed_cert_followed_by_intermediates"
ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1")
#ssl.openssl.ssl-conf-cmd += ("Curves" => "X25519:prime256v1:secp384r1")  # lighttpd 1.4.82 TLS default appends X448
ssl.openssl.ssl-conf-cmd += ("Options" => "+ServerPreference")
# TLS modules besides mod_openssl might name ciphers differently
# See https://wiki.lighttpd.net/Docs_SSL
ssl.openssl.ssl-conf-cmd += ("CipherString" => "@SECLEVEL=0:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA")
