# generated 1970-01-01, Mozilla Guideline v5.7, lighttpd 1.4.82, OpenSSL 3.6.1, intermediate config, PQ: only, HSTS, OCSP
# https://ssl-config.mozilla.org/#server=lighttpd&version=1.4.82&config=intermediate&openssl=3.6.1&guideline=5.7&hsts=true&ocsp=true&pq=only
#server.port = 80
$SERVER["socket"] == "[::]:80" { }

# select one TLS module: "mod_openssl" "mod_mbedtls" "mod_gnutls" "mod_wolfssl" "mod_nss"
server.modules += ("mod_openssl")

# lighttpd 1.4.56 and later will inherit ssl.* from the global scope if
# $SERVER["socket"] contains ssl.engine = "enable" and no other ssl.* options
# (to avoid having to repeat ssl.* directives in both ":443" and "[::]:443")
$SERVER["socket"] ==     ":443" { ssl.engine = "enable" }
$SERVER["socket"] == "[::]:443" { ssl.engine = "enable" }
ssl.privkey = "/path/to/private_key"
ssl.pemfile = "/path/to/signed_cert_followed_by_intermediates"
#ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1.3")  # lighttpd 1.4.82 TLS default
#ssl.openssl.ssl-conf-cmd += ("Curves" => "X25519MLKEM768")  # lighttpd 1.4.82 TLS default appends X448

# lighttpd TLS defaults are widely supported by clients and should be preferred.
# See https://wiki.lighttpd.net/Docs_SSL
# Uncomment to better match the less restricted Mozilla intermediate spec.
#ssl.openssl.ssl-conf-cmd += ("CipherString" => "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305")

# OCSP stapling (input file must be maintained by external script, e.g. cert-staple.sh)
# https://wiki.lighttpd.net/Docs_SSL#OCSP-Stapling
ssl.stapling-file = "/path/to/cert-staple.der"

server.modules += ("mod_redirect")
server.modules += ("mod_setenv")
$HTTP["scheme"] == "https" {
    # HTTP Strict Transport Security (63072000 seconds)
    setenv.add-response-header = (
      "Strict-Transport-Security" => "max-age=63072000; includeSubDomains"
    )
}
else $HTTP["scheme"] == "http" {
    url.redirect = ("" => "https://${url.authority}${url.path}${qsa}")
}
