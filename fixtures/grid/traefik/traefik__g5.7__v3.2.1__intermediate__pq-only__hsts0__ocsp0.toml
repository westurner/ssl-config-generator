# generated 1970-01-01, Mozilla Guideline v5.7, Traefik 3.2.1, intermediate config, PQ: only
# https://ssl-config.mozilla.org/#server=traefik&version=3.2.1&config=intermediate&guideline=5.7&hsts=false&ocsp=false&pq=only
[http.routers]
  [http.routers.router-secure]
    rule = "Host(`example.com`)"
    service = "service-id"

    [http.routers.router-secure.tls]
      options = "intermediate"

# due to Go limitations, it is highly recommended that you use an ECDSA
# certificate, or you may experience compatibility issues
[[tls.certificates]]
  certFile = "/path/to/signed_cert_plus_intermediates"
  keyFile = "/path/to/private_key"

[tls.options]
  [tls.options.intermediate]
      minVersion = "VersionTLS13"
      # PQ-only: Traefik currently only exposes the X25519MLKEM768
      # hybrid group via curvePreferences.
      curvePreferences = ["X25519MLKEM768"]
      cipherSuites = [
        "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
        "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
        "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
        "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
        "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
        "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256"
      ]
