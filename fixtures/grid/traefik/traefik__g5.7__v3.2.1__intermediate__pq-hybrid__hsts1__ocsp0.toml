# generated 1970-01-01, Mozilla Guideline v5.7, Traefik 3.2.1, intermediate config, PQ: hybrid, HSTS
# https://ssl-config.mozilla.org/#server=traefik&version=3.2.1&config=intermediate&hsts&guideline=5.7
[http.routers]
  [http.routers.router-secure]
    rule = "Host(`example.com`)"
    service = "service-id"
    middlewares = ["hsts-header"]

    [http.routers.router-secure.tls]
      options = "intermediate"

  [http.routers.router-insecure]
    rule = "Host(`example.com`)"
    service = "service-id"
    middlewares = ["redirect-to-https", "hsts-header"]

[http.middlewares]
  [http.middlewares.redirect-to-https.redirectScheme]
    scheme = "https"
  [http.middlewares.hsts-header.headers]
    stsSeconds = 63072000
    stsIncludeSubdomains = true
    # stsPreload requires registering on https://hstspreload.org/
    # before enabling — see
    # https://infosec.mozilla.org/guidelines/web_security#http-strict-transport-security
    #stsPreload = true

# due to Go limitations, it is highly recommended that you use an ECDSA
# certificate, or you may experience compatibility issues
[[tls.certificates]]
  certFile = "/path/to/signed_cert_plus_intermediates"
  keyFile = "/path/to/private_key"

[tls.options]
  [tls.options.intermediate]
      minVersion = "VersionTLS12"
      curvePreferences = ["X25519","CurveP256","CurveP384"]
      cipherSuites = [
        "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
        "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
        "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
        "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
        "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
        "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256"
      ]
