# generated 1970-01-01, TLSRef Guideline v5.7, Redis 7.4.1, OpenSSL 4.0.0, intermediate config, PQ: only
# https://ssl-config.mozilla.org/#server=redis&version=7.4.1&config=intermediate&openssl=4.0.0&guideline=5.7&hsts=false&ocsp=false&pq=only
port 0
tls-port 6379
tls-cluster yes
tls-replication yes

tls-cert-file /path/to/signed_cert_plus_intermediates
tls-key-file /path/to/private_key

# redis requires one of these, as it does not implicitly use the system-wide default
tls-ca-cert-file /path/to/ca_certificates.crt
tls-ca-cert-dir /path/to/ca_certificates

# intermediate configuration
tls-protocols "TLSv1.3"
tls-prefer-server-ciphers no
tls-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
tls-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# curl https://ssl-config.mozilla.org/ffdhe2048.txt > /path/to/dhparam
tls-dh-params-file /path/to/dhparam

# Post-quantum (ML-KEM hybrid) key exchange:
#   This server has no native TLS group / curve directive; ML-KEM
#   hybrid groups (e.g. X25519MLKEM768) reach the wire only if the
#   linked OpenSSL is configured to offer them via openssl.cnf, in
#   the [system_default_sect] Groups = … line. See the
#   "OpenSSL (openssl.cnf)" target in this generator for a
#   ready-to-paste snippet, and locate your active openssl.cnf with:
#       openssl version -d
#   To use a different openssl.cnf for THIS process only (e.g. when
#   you do not want to change the system-wide file), set the
#   OPENSSL_CONF environment variable before launching the server:
#       OPENSSL_CONF=/path/to/your-openssl.cnf <server-binary> ...
#   The OPENSSL_CONF override has been honoured by libssl since
#   OpenSSL 0.9.7 (see openssl-config(5) / OPENSSL_init_crypto(3)).
