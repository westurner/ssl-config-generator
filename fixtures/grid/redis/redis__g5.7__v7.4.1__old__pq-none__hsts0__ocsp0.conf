# generated 1970-01-01, Mozilla Guideline v5.7, Redis 7.4.1, OpenSSL 3.6.1, old config, PQ: none
# https://ssl-config.mozilla.org/#server=redis&version=7.4.1&config=old&openssl=3.6.1&guideline=5.7&pq=none
port 0
tls-port 6379
tls-cluster yes
tls-replication yes

tls-cert-file /path/to/signed_cert_plus_intermediates
tls-key-file /path/to/private_key

# redis requires one of these, as it does not implicitly use the system-wide default
tls-ca-cert-file /path/to/ca_certificates.crt
tls-ca-cert-dir /path/to/ca_certificates

# old configuration
tls-protocols "TLSv1 TLSv1.1 TLSv1.2 TLSv1.3"
tls-prefer-server-ciphers yes
tls-ciphers @SECLEVEL=0:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA
tls-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

# curl https://ssl-config.mozilla.org/ffdhe1024.txt > /path/to/dhparam
tls-dh-params-file /path/to/dhparam
