# generated 1970-01-01, TLSRef Guideline v6.0, Exim 4.98, OpenSSL 4.0.0, modern config, PQ: hybrid
# https://ssl-config.mozilla.org/#server=exim&version=4.98&config=modern&openssl=4.0.0&guideline=6.0&hsts=false&ocsp=false&pq=hybrid
tls_advertise_hosts = *
tls_certificate = /path/to/signed_cert_plus_intermediates
tls_privatekey = /path/to/private_key

# modern configuration
openssl_options = +no_sslv2 +no_sslv3 +no_tlsv1 +no_tlsv1_1 +no_tlsv1_2
tls_eccurve = X25519MLKEM768:X25519:prime256v1:secp384r1
