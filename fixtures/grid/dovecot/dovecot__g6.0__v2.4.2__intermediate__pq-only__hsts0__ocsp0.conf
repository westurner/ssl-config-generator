# generated 1970-01-01, Mozilla Guideline v6.0, Dovecot 2.4.2, OpenSSL 3.6.1, intermediate config, PQ: only
# https://ssl-config.mozilla.org/#server=dovecot&version=2.4.2&config=intermediate&openssl=3.6.1&guideline=6.0&pq=only
ssl = required

ssl_server_cert_file = /path/to/signed_cert_plus_intermediates
