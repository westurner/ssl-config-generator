# generated 1970-01-01, TLSRef Guideline v5.7, Dovecot 2.4.2, OpenSSL 4.0.0, intermediate config, PQ: hybrid
# https://ssl-config.mozilla.org/#server=dovecot&version=2.4.2&config=intermediate&openssl=4.0.0&guideline=5.7&hsts=false&ocsp=false&pq=hybrid
ssl = required

ssl_server_cert_file = /path/to/signed_cert_plus_intermediates
ssl_server_key_file = /path/to/private_key

# curl https://ssl-config.mozilla.org/ffdhe2048.txt > /path/to/dhparam
ssl_dh = </path/to/dhparam

# intermediate configuration
ssl_min_protocol = TLSv1.2
ssl_server_prefer_ciphers = client
ssl_curve_list = X25519:prime256v1:secp384r1
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
