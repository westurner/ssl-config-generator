# generated 1970-01-01, Mozilla Guideline v5.7, ProFTPD 1.3.8, OpenSSL 3.6.1, intermediate config, PQ: none, OCSP
# https://ssl-config.mozilla.org/#server=proftpd&version=1.3.8&config=intermediate&openssl=3.6.1&guideline=5.7&hsts=false&ocsp=true&pq=none
TLSEngine                     on
TLSRequired                   on

TLSCertificateChainFile       /path/to/certificate_chain

# ECDSA certificate
TLSECCertificateFile          /path/to/signed_cert
TLSECCertificateKeyFile       /path/to/private_key

# RSA certificate, if using RSA certificates instead
# TLSRSACertificateFile         /path/to/signed_cert
# TLSRSACertificateKeyFile      /path/to/private_key

# curl https://ssl-config.mozilla.org/ffdhe2048.txt >> /path/to/dhparam
TLSDHParamFile                /path/to/dhparam

# intermediate configuration
TLSProtocol                   TLSv1.2 TLSv1.3
TLSECDHCurve                  X25519:prime256v1:secp384r1
TLSCipherSuite                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
TLSServerCipherPreference     off
TLSSessionTickets             off

TLSStapling                   on
# requires mod_tls_shmcache
TLSStaplingCache              shm:/file=/var/ftpd/ocsp_pcache
