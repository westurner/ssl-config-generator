# generated 1970-01-01, TLSRef Guideline v6.0, ProFTPD 1.3.8, OpenSSL 4.0.0, intermediate config, PQ: none
# https://ssl-config.mozilla.org/#server=proftpd&version=1.3.8&config=intermediate&openssl=4.0.0&guideline=6.0&hsts=false&ocsp=false&pq=none
TLSEngine                     on
TLSRequired                   on

TLSCertificateChainFile       /path/to/certificate_chain

# ECDSA certificate
TLSECCertificateFile          /path/to/signed_cert
TLSECCertificateKeyFile       /path/to/private_key

# RSA certificate, if using RSA certificates instead
# TLSRSACertificateFile         /path/to/signed_cert
# TLSRSACertificateKeyFile      /path/to/private_key

# intermediate configuration
TLSProtocol                   TLSv1.2 TLSv1.3
TLSECDHCurve                  X25519:prime256v1:secp384r1
TLSCipherSuite                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
TLSServerCipherPreference     off
TLSSessionTickets             off
