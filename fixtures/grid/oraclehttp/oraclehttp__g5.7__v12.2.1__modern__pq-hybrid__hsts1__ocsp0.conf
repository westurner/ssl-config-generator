# generated 1970-01-01, TLSRef Guideline v5.7, Oracle HTTP 12.2.1, modern config, PQ: hybrid, HSTS
# https://ssl-config.mozilla.org/#server=oraclehttp&version=12.2.1&config=modern&guideline=5.7&hsts=true&ocsp=false&pq=hybrid
<VirtualHost *:80>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^.*$ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,QSA,L]
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    SSLWallet           /path/to/wallet

    # HTTP Strict Transport Security (mod_headers is required) (63072000 seconds)
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
</VirtualHost>

# modern configuration
SSLProtocol             -all +
SSLCipherSuite          
SSLHonorCipherOrder     off
