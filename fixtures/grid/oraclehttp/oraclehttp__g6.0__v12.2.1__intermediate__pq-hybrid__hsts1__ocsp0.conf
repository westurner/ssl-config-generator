# generated 1970-01-01, Mozilla Guideline v6.0, Oracle HTTP 12.2.1, intermediate config, PQ: hybrid, HSTS
# https://ssl-config.mozilla.org/#server=oraclehttp&version=12.2.1&config=intermediate&guideline=6.0&hsts=true&ocsp=false&pq=hybrid
<VirtualHost *:80>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^.*$ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,QSA,L]
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    SSLWallet           /path/to/wallet

    # HTTP Strict Transport Security (mod_headers is required) (63072000 seconds)
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
</VirtualHost>

# intermediate configuration
SSLProtocol             -all +TLSv1.2
SSLCipherSuite          TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256:TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256:TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384:TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384:TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256:TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
SSLHonorCipherOrder     off
