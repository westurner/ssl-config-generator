# generated 1970-01-01, Mozilla Guideline v5.7, OpenLDAP (slapd) 2.6.9, OpenSSL 3.6.1, intermediate config, PQ: none
# https://ssl-config.mozilla.org/#server=openldap&version=2.6.9&config=intermediate&openssl=3.6.1&guideline=5.7&hsts=false&ocsp=false&pq=none
#
# OpenLDAP (slapd) TLS configuration (intermediate profile).
#
# slapd.conf-style directives are shown below; the equivalent
# cn=config attributes (olcTLSCipherSuite, olcTLSProtocolMin,
# olcTLSECName, ...) accept the same values. TLSv1.3 ciphersuites
# are NOT settable via slapd directives; they are inherited from
# the system openssl.cnf [system_default_sect] Ciphersuites line
# (see the "OpenSSL config (openssl.cnf)" target in this tool).

TLSCertificateFile    /path/to/signed_cert_plus_intermediates
TLSCertificateKeyFile /path/to/private_key
TLSCACertificateFile  /path/to/ca_certs

# Minimum protocol version. OpenLDAP uses on-the-wire numbering:
#   3.1 = TLS 1.0, 3.2 = TLS 1.1, 3.3 = TLS 1.2, 3.4 = TLS 1.3.
TLSProtocolMin 3.3   # TLSv1.2

# TLSv1.2 (and earlier) cipher list (OpenSSL cipher syntax).
# TLSv1.3 ciphersuites are not configurable here — see openssl.cnf.
TLSCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305

# Key-exchange groups (a.k.a. "curves") in preference order.
# OpenLDAP 2.5+ accepts a colon-separated list; earlier releases
# only honour the first entry.
TLSECName X25519:prime256v1:secp384r1

# curl https://ssl-config.mozilla.org/ffdhe2048.txt > /path/to/dhparam
TLSDHParamFile /path/to/dhparam
