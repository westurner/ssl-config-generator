# generated 1970-01-01, TLSRef Guideline v5.7, OpenLDAP (slapd) 2.6.9, OpenSSL 4.0.0, old config, PQ: only
# https://ssl-config.mozilla.org/#server=openldap&version=2.6.9&config=old&openssl=4.0.0&guideline=5.7&hsts=false&ocsp=false&pq=only
#
# OpenLDAP (slapd) TLS configuration (old profile).
#
# slapd.conf-style directives are shown below; the equivalent
# cn=config attributes (olcTLSCipherSuite, olcTLSProtocolMin,
# olcTLSECName, ...) accept the same values. TLSv1.3 ciphersuites
# are NOT settable via slapd directives; they are inherited from
# the system openssl.cnf [system_default_sect] Ciphersuites line
# (see the "OpenSSL config (openssl.cnf)" target in this tool).
#
# Post-quantum: ML-KEM hybrid key-exchange groups (X25519MLKEM768,
# SecP256r1MLKEM768, SecP384r1MLKEM1024) are TLS 1.3-only
# (key_share extension) and are passed to OpenSSL via TLSECName.
#
# PQ-only mode: TLSProtocolMin is pinned to 3.4 (TLS 1.3) below;
# ML-KEM groups are not defined for TLS 1.2 and earlier, so
# allowing a lower MinProtocol would mean a TLS-1.2 fallback would
# silently negotiate classical-only key exchange.

TLSCertificateFile    /path/to/signed_cert_plus_intermediates
TLSCertificateKeyFile /path/to/private_key
TLSCACertificateFile  /path/to/ca_certs

# Minimum protocol version. OpenLDAP uses on-the-wire numbering:
#   3.1 = TLS 1.0, 3.2 = TLS 1.1, 3.3 = TLS 1.2, 3.4 = TLS 1.3.
TLSProtocolMin 3.4   # TLSv1.3

# TLSv1.2 (and earlier) cipher list (OpenSSL cipher syntax).
# TLSv1.3 ciphersuites are not configurable here — see openssl.cnf.
TLSCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA

# Key-exchange groups (a.k.a. "curves") in preference order.
# OpenLDAP 2.5+ accepts a colon-separated list; earlier releases
# only honour the first entry.
# PQ-only mode: classical curves are intentionally omitted.
TLSECName X25519MLKEM768

# curl https://ssl-config.mozilla.org/ffdhe1024.txt > /path/to/dhparam
TLSDHParamFile /path/to/dhparam
